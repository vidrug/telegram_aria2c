# RPC settings
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800

# Download settings
dir=/downloads
max-concurrent-downloads=5
max-connection-per-server=16
split=16
min-split-size=1M
continue=true
always-resume=true

# Session (resume downloads after restart)
input-file=/aria2/session.txt
save-session=/aria2/session.txt
save-session-interval=30
force-save=true

# BitTorrent
enable-dht=true
enable-dht6=true
dht-file-path=/aria2/dht.dat
dht-file-path6=/aria2/dht6.dat
dht-listen-port=6881
listen-port=6881
enable-peer-exchange=true
bt-enable-lpd=true
seed-ratio=0.0
bt-max-peers=100
bt-request-peer-speed-limit=10M
follow-torrent=true
bt-tracker=udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.openbittorrent.com:6969/announce,udp://open.stealth.si:80/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://tracker.tiny-vps.com:6969/announce,udp://tracker.moeking.me:6969/announce,udp://explodie.org:6969/announce,udp://tracker.cyberia.is:6969/announce

# Performance
disk-cache=64M
file-allocation=none

# Logging
console-log-level=notice
