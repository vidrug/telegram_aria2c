services:
  aria2:
    build: ./aria2
    env_file: .env
    volumes:
      - ./downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"jsonrpc\":\"2.0\",\"id\":\"hc\",\"method\":\"aria2.getVersion\"}' http://localhost:6800/jsonrpc || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    environment:
      - ARIA2_RPC_URL=ws://aria2:6800/jsonrpc
      - DOWNLOAD_DIR=/downloads
    volumes:
      - ./downloads:/downloads
    depends_on:
      aria2:
        condition: service_healthy
    restart: unless-stopped
