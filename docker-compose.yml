services:
  aria2:
    build: ./aria2
    env_file: .env
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./downloads:/downloads
      - aria2-dht:/aria2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -d '{\"jsonrpc\":\"2.0\",\"id\":\"hc\",\"method\":\"aria2.getVersion\",\"params\":[\"token:'$ARIA2_RPC_SECRET'\"]}' http://localhost:6800/jsonrpc"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    privileged: true
    environment:
      - ARIA2_RPC_URL=ws://aria2:6800/jsonrpc
      - DOWNLOAD_DIR=/downloads
      - USB_MOUNT_PATH=/mnt
    volumes:
      - ./downloads:/downloads
      - /mnt:/mnt:rslave
    depends_on:
      aria2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aria2-dht:
